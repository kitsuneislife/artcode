[package]
name = "interpreter"
version = "0.5.1"
edition = "2024"

[dependencies]
core = { path = "../core" }
diagnostics = { path = "../diagnostics" }

# The interpreter consumes an AST, it does not produce one: nothing under `src/`
# refers to `parser` or `lexer`. Tests and benches build their input from source
# text, so both belong here rather than in the production dependency graph.
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
lexer = { path = "../lexer" }
parser = { path = "../parser" }
serde_json = "1.0"
# `capability_tokens` exercises the move-tracking rule and the runtime side of
# capabilities in one file, so it needs both crates.
typeck = { path = "../typeck" }

[[bench]]
name = "perf"
harness = false

[[bench]]
name = "front"
harness = false
