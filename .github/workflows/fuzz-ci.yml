name: Fuzz CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  fuzz:
    name: fuzz — ${{ matrix.target }}
    runs-on: ubuntu-latest
    # The cost here is the instrumented build, not the fuzzing: lexer, parser,
    # interpreter and diagnostics are all recompiled with sanitizer coverage
    # before a single input runs. 45 minutes covers a cold cache; a warm one
    # finishes in a couple of minutes.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [parser_loops, interpreter_valid]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Install LLVM/Clang
        run: sudo apt-get update && sudo apt-get install -y clang lld

      # cargo-fuzz builds into `fuzz/cargo_fuzz/target`, which is a separate
      # workspace and was never covered by the default `./target` cache — so
      # every run paid for the full instrumented build from scratch. The shared
      # key lets both matrix jobs restore the same artifacts.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzz
          workspaces: |
            . -> target
            fuzz/cargo_fuzz -> target

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # -timeout=25 makes libFuzzer report a hanging input as a finding after 25
      # seconds. The default is 1200s per input, long enough to swallow the whole
      # job and look like an infrastructure problem rather than a bug.
      - name: Run fuzz worker
        run: cargo fuzz run ${{ matrix.target }} --fuzz-dir fuzz/cargo_fuzz -- -max_total_time=60 -timeout=25

      # libFuzzer writes the offending input to `artifacts/` and names it after
      # its hash. Without this the file dies with the runner, so a finding can
      # only be reproduced by guessing at it from the log — which is how the
      # first timeout went unexplained for two CI cycles.
      - name: Upload crashing and timing-out inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings-${{ matrix.target }}
          path: fuzz/cargo_fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30
