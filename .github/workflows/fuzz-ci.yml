name: Fuzz CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  parser-loops-fuzz:
    runs-on: ubuntu-latest
    # 20 minutes was not enough for the work this job actually does: building
    # cargo-fuzz from source plus instrumenting both targets consumes most of
    # the budget before any fuzzing starts, so the run was cancelled mid-way
    # through the second worker rather than failing on a finding.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Install LLVM/Clang
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run parser/loops fuzz worker
        run: cargo fuzz run parser_loops --fuzz-dir fuzz/cargo_fuzz -- -max_total_time=60

      - name: Run interpreter/valid fuzz worker
        run: cargo fuzz run interpreter_valid --fuzz-dir fuzz/cargo_fuzz -- -max_total_time=60
