name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      # --locked also guards against Cargo.lock drifting away from the
      # crate versions declared in the Cargo.toml manifests.
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rustfmt
        run: cargo fmt --all -- --check

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Run xtask gen-golden --check
        run: cargo run -p xtask -- gen-golden --check

      - name: Build (all)
        run: cargo build --workspace --all-targets --locked

      - name: Run tests
        run: cargo test --workspace --locked --quiet

  metrics:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build CLI (debug)
        run: cargo build -p cli --bin art

      - name: Run metrics script
        run: |
          chmod +x scripts/run_metrics.sh || true
          mkdir -p artifacts
          bash scripts/run_metrics.sh examples/17_metrics_arena_demo.art artifacts/metrics.json || true

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: artifacts/metrics.json

  node-smoke-test:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build CLI (debug)
        run: cargo build -p cli --bin art

      - name: Bundle hello world to JS
        run: target/debug/art build examples/00_hello.art --target js --bundle --out /tmp/dist/

      - name: Run bundled output with Node.js
        run: |
          output=$(node /tmp/dist/00_hello.js)
          if [ "$output" != "Hello, Artcode!" ]; then
            echo "ERROR: expected 'Hello, Artcode!' but got: $output"
            exit 1
          fi
          echo "PASS: Node.js output matches expected"

  artkit-smoke:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build CLI (debug)
        run: cargo build -p cli --bin art

      - name: Bundle counter.art
        run: target/debug/art build examples/artkit/counter.art --target js --bundle --out /tmp/artkit/

      - name: Verify bundle with Node.js (no runtime errors)
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from 'fs';
          // The bundle must load without throwing
          const src = readFileSync('/tmp/artkit/counter.js', 'utf8');
          const fn = new Function(src);
          fn();
          console.log("PASS: counter.js loaded without errors");
          EOF

  perf-regression:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build CLI (debug)
        run: cargo build -p cli --bin art

      - name: Run performance regression check
        run: bash scripts/perf_regression.sh target/debug/art

  coverage:
    needs: build-and-test
    # Run coverage only on manual dispatch to avoid long runs on every push
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      # --no-fail-fast so every failing test target is reported in one run.
      # Without it cargo stops at the first failure and the remaining targets
      # are never executed, which turns one broken assumption shared by several
      # tests into one CI cycle per test.
      - name: Run coverage
        run: cargo llvm-cov --workspace --no-fail-fast --ignore-filename-regex ".*/target/.*" --lcov --output-path lcov.info

      - name: Coverage threshold (≥60%)
        run: |
          lines=$(grep -h '^DA:' lcov.info | awk -F',' '{covered+=$2; total+=1} END { if (total==0) { print "0 0" } else { print covered" "total }}')
          covered=$(echo $lines | awk '{print $1}')
          total=$(echo $lines | awk '{print $2}')
          pct=0
          if [ "$total" -gt 0 ]; then pct=$(awk -v c=$covered -v t=$total 'BEGIN { printf("%.2f", (c/t)*100) }'); fi
          echo "Coverage: $pct%"
          awk -v p=$pct 'BEGIN { exit (p < 60.0) ? 1 : 0 }'

      - name: Generate badge
        run: scripts/gen_coverage_badge.sh lcov.info target/coverage_badge.svg

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

      - name: Upload coverage badge
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: target/coverage_badge.svg
